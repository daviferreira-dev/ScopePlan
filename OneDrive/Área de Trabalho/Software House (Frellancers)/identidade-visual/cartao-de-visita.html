<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Forja — Cartão de Visita</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#e5e1dc;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'DM Sans',sans-serif}
.card{width:350px;height:200px;border-radius:16px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.12);display:flex}
.card-front{flex:1;background:#0C1C3E;padding:2rem;display:flex;flex-direction:column;justify-content:space-between}
.card-front .logo-area{display:flex;align-items:center;gap:12px}
.card-front .logo-area svg{width:36px;height:36px}
.card-front .logo-area span{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;color:#fff;letter-spacing:.06em}
.card-front .tagline{font-size:12px;color:rgba(255,255,255,.4);font-style:italic;letter-spacing:.02em}
.card-back{width:140px;background:#E85D20;padding:1.5rem;display:flex;flex-direction:column;justify-content:center;gap:10px}
.card-back .info{font-size:10.5px;color:#fff;font-weight:400;line-height:1.5}
.card-back .info strong{font-weight:500;display:block;margin-bottom:1px}
.card-back .divider{width:20px;height:1px;background:rgba(255,255,255,.3)}
</style>
</head>
<body>
<div class="card">
  <!-- FRENTE -->
  <div class="card-front">
    <div class="logo-area">
      <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <rect width="48" height="48" rx="8" fill="rgba(255,255,255,.1)"/>
        <rect x="14" y="12" width="5" height="24" fill="#E85D20"/>
        <rect x="14" y="12" width="20" height="5" fill="#E85D20"/>
        <rect x="14" y="22" width="15" height="5" fill="#E85D20"/>
      </svg>
      <span>FORJA</span>
    </div>
    <div class="tagline">Presença digital que vende.</div>
  </div>
  <!-- VERSO -->
  <div class="card-back">
    <div class="info"><strong>Nome Sobrenome</strong>Founder & Dev</div>
    <div class="divider"></div>
    <div class="info">contato@forja.dev<br>(11) 99999-0000<br>forja.dev</div>
  </div>
</div>
</body>
</html>
